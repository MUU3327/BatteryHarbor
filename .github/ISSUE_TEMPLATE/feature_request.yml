name: Feature request
description: 提议新的功能或交互改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 说明你在什么情况下需要这个功能。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的行为、界面或快捷指令。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案

  - type: dropdown
    id: hardware
    attributes:
      label: 是否涉及新的 SMC 写入或硬件控制
      options:
        - 否
        - 是
        - 不确定
    validations:
      required: true
